<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Aurora over Earth</title>
  <desc id="desc">Green and cyan aurora curtains rising above Earth's curved horizon in space.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".52" stop-color="#071838"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" x2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".45" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="earth" cx="50%" cy="12%" r="75%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".35" stop-color="#1d4ed8"/>
      <stop offset=".72" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1800" height="900" fill="url(#sky)"/>
  <g fill="#e0f2fe" opacity=".5">
