    <circle cx="332" cy="82" r="1.8"/>
    <circle cx="606" cy="210" r="2.5"/>
    <circle cx="888" cy="112" r="2"/>
    <circle cx="1208" cy="174" r="1.9"/>
    <circle cx="1514" cy="98" r="2.1"/>
