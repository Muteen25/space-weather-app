  <path d="M0 558c134-48 232-34 322 22 120 74 236 64 352-32 142-118 306-134 498-44 174 81 366 88 628-52" fill="none" stroke="#86efac" stroke-width="22" stroke-linecap="round" opacity=".44"/>
  <path d="M0 657c150-62 270-40 380 24 128 76 260 69 396-20 158-104 324-102 514-2 142 75 304 94 510 10" fill="none" stroke="#67e8f9" stroke-width="20" stroke-linecap="round" opacity=".28"/>
